// ── Language helpers ──────────────────────────────────────────────────────────
let currentLang = localStorage.getItem(LANG_KEY) || 'nl';
function t(key) { return translations[currentLang][key] || translations.nl[key] || key; }

function getMarketSubtitle() {
  const m = MARKETS[currentMarket];
  if (m.variant) return m.variant;
  return t(`country-${m.country}`);
}
function getMarketLabel(id) {
  const m = MARKETS[id];
  const country = t(`country-${m.country}`);
  const brand = m.brand || 'Aldi';
  if (m.variant) return `${m.flag} ${brand} ${m.variant}`;
  if (m.brand)   return `${m.flag} ${m.brand}`;
  return `${m.flag} ${country}`;
}
function populateMarketSelect() {
  const sel = document.getElementById('market-select');
  sel.innerHTML = currentStore.markets.map(id =>
    `<option value="${id}">${getMarketLabel(id)}</option>`
  ).join('');
  sel.value = currentMarket;
  // A store with a single market needs no picker.
  sel.style.display = currentStore.markets.length > 1 ? '' : 'none';
}

// Restrict the language selector to languages the current market actually offers
// products in. If the active UI lang isn't supported, auto-switch to the market's
// first language so the user never lands in an inconsistent state.
function populateLangSelect() {
  const sel = document.getElementById('lang-select');
  const allowed = MARKETS[currentMarket].siteLangs;
  if (!allowed.includes(currentLang)) {
    currentLang = allowed[0];
    localStorage.setItem(LANG_KEY, currentLang);
  }
  sel.innerHTML = allowed.map(l =>
    `<option value="${l}">${l.toUpperCase()}</option>`
  ).join('');
  sel.value = currentLang;
  // Hide the picker when the store offers a single language.
  sel.style.display = allowed.length > 1 ? '' : 'none';
}

// Defaults to fall back to when a market doesn't supply theme overrides.
const THEME_DEFAULTS = {
  '--blue':      '#003087',
  '--red':       '#E2001A',
  '--stripe':    '#E2001A',
  '--accent':    '#d6e4f7',
  '--accent-fg': '#003087',
  '--too-high':  '#dc2626',
};
function applyTheme() {
  const overrides = (MARKETS[currentMarket].theme) || {};
  const root = document.documentElement;
  for (const [k, v] of Object.entries(THEME_DEFAULTS)) {
    root.style.setProperty(k, overrides[k] || v);
  }
}

function updateHeaderAndFooter() {
  // populateLangSelect may auto-correct currentLang for the current market,
  // so it must run before any t()-based text rendering below.
  populateLangSelect();
  applyTheme();
  document.querySelector('.logo-aldi').textContent = MARKETS[currentMarket].logo || 'ALDI';
  document.querySelector('.logo-sub').textContent = getMarketSubtitle();
  const full = t('raad-de-prijs');
  const lastSpace = full.lastIndexOf(' ');
  const main      = lastSpace >= 0 ? full.slice(0, lastSpace) : full;
  const highlight  = lastSpace >= 0 ? full.slice(lastSpace + 1) : '';
  document.querySelector('.header-right h1').innerHTML =
    highlight ? `${main} <span>${highlight}</span>` : `<span>${main}</span>`;
  document.querySelector('footer').innerHTML = t('footer').replace('{store}', currentStore.name);
  document.title = `Winkle · ${currentStore.name}`;
  populateMarketSelect();
}
async function changeLang(lang) {
  currentLang = lang;
  localStorage.setItem(LANG_KEY, lang);
  document.getElementById('lang-select').value = lang;
  updateHeaderAndFooter();

  // Re-fetch the product on every language change, keeping existing guesses. For
  // multilang markets this translates the name + description.
  const state = loadState();
  if (state && state.product) {
    document.getElementById('app').innerHTML = `
      <div class="card card-center">
        <div class="spinner"></div>
        <div class="loading-label">${t('product-van-dag')}</div>
      </div>`;
    try {
      const newProduct = await fetchProduct(todayKey);
      const newState = { ...state, product: newProduct };
      saveState(newState);
      product  = newProduct;
      guesses  = [];
      gameOver = false;
      if (newState.done) {
        showAlreadyPlayed(newState);
      } else {
        buildGameUI(state.guesses || []);
      }
      return;
    } catch (e) {
      // On failure: fall through to startGame (which surfaces an error card if needed).
    }
  }
  startGame();
}
function changeMarket(market) {
  if (!currentStore.markets.includes(market)) return;
  currentMarket = market;
  localStorage.setItem(MARKET_KEY, market);
  updateHeaderAndFooter();
  startGame();
}

let product  = null;
let guesses  = [];
let gameOver = false;
let todayKey = '';   // e.g. "2026-05-15"

// ── Analytics ─────────────────────────────────────────────────────────────
// Fire-and-forget POST to /api/event. Wrapped so a server hiccup never
// disrupts the game. Uses sendBeacon when available so 'finish' events
// survive a page close.
function track(type, data) {
  const body = JSON.stringify({ type, market: currentMarket, lang: currentLang, ...(data || {}) });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/event', new Blob([body], { type: 'application/json' }));
    } else {
      fetch('/api/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true }).catch(()=>{});
    }
  } catch {}
}

// Once per browser per UTC day; refreshes don't inflate.
function trackVisitOnce() {
  const key = 'aldidle-visit-' + new Date().toISOString().slice(0,10);
  if (localStorage.getItem(key)) return;
  localStorage.setItem(key, '1');
  track('visit');
}

// ── Date helpers ──────────────────────────────────────────────────────────
function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getDayNumber() {
  // Count days since launch: 2026-01-01
  const launch = new Date('2026-01-01');
  const today  = new Date();
  today.setHours(0,0,0,0);
  launch.setHours(0,0,0,0);
  return Math.floor((today - launch) / 86400000) + 1;
}

function formatDate(key) {
  const [y,m,d] = key.split('-');
  const months = {
    nl: ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'],
    fr: ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'],
    de: ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'],
  };
  const m3 = (months[currentLang] || months.nl)[parseInt(m)-1];
  return `${parseInt(d)} ${m3} ${y}`;
}

// Deterministic seed from date string → integer
function dateToSeed(dateStr) {
  let h = 0;
  for (let i = 0; i < dateStr.length; i++) {
    h = Math.imul(31, h) + dateStr.charCodeAt(i) | 0;
  }
  return Math.abs(h);
}

// Seeded pseudo-random (mulberry32)
function seededRandom(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── Local state (per market) ──────────────────────────────────────────────
function loadState() {
  try {
    const raw = localStorage.getItem(getStorageKey());
    if (!raw) return null;
    const state = JSON.parse(raw);
    if (state.date !== todayKey) return null;   // old day
    return state;
  } catch { return null; }
}

function saveState(data) {
  try { localStorage.setItem(getStorageKey(), JSON.stringify({ date: todayKey, ...data })); }
  catch {}
}

// ── Fetch product from local scraper server ───────────────────────────────
async function fetchProduct(dateKey) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 55000);
  try {
    const resp = await fetch(`/api/product?date=${dateKey}&market=${currentMarket}&lang=${currentLang}`, { signal: controller.signal });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `Server fout ${resp.status}`);
    }
    const data = await resp.json();
    if (!data.name || !data.price) throw new Error('Ongeldig product ontvangen van server');
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Server reageert niet — probeer het opnieuw.');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

        </div>
        <button class="guess-btn" id="guess-btn" onclick="submitGuess()">${t('raad')}</button>
        <div id="error-msg" class="error-msg hidden"></div>
      </div>

      <div class="feedback-list" id="feedback-list"></div>

      <div class="legend">
        <span><div class="legend-dot low"></div>${t('te-laag')}</span>
        <span><div class="legend-dot high"></div>${t('te-hoog')}</span>
        <span><div class="legend-dot ok"></div>${t('correct')}</span>
      </div>
    </div>
  `;

  document.getElementById('price-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitGuess();
  });

  // Replay saved guesses silently
  if (restoredGuesses && restoredGuesses.length > 0) {
    for (const g of restoredGuesses) replayGuess(g);
    if (gameOver) setTimeout(() => showResult(didWin()), 300);
  } else {
    document.getElementById('price-input').focus();
  }
}

function didWin() {
  if (!guesses.length) return false;
  const last = guesses[guesses.length - 1];
  const margin = product.price * MARGIN;
  return last >= product.price - margin && last <= product.price + margin;
}

// ── Replay a guess without animation (for restore) ────────────────────────
function replayGuess(val) {
  const idx = guesses.length;
  guesses.push(val);

  const margin = product.price * MARGIN;
  const low    = product.price - margin;
  const high   = product.price + margin;

  let type, icon, hint;
  if (val >= low && val <= high)    { type='correct';  icon='✓'; hint=t('raak'); }
  else if (val < low)               { type='too-low';  icon='↑'; hint=val<=product.price*.5?t('veel-te-laag'):t('te-laag'); }
  else                              { type='too-high'; icon='↓'; hint=val>=product.price*2?t('veel-te-hoog'):t('te-hoog'); }

  const dot = document.getElementById(`dot-${idx}`);
  if (dot) {
    dot.classList.remove('current');
    dot.classList.add(`used-${type==='correct'?'correct':type==='too-high'?'high':'low'}`);
    dot.textContent = icon;
  }
  if (idx+1 < MAX_GUESSES) document.getElementById(`dot-${idx+1}`)?.classList.add('current');

  document.getElementById('progress-bar').style.width = `${((idx+1)/MAX_GUESSES)*100}%`;

  const li = document.createElement('div');
  li.className = `feedback-item ${type==='correct'?'correct':type==='too-high'?'too-high':'too-low'}`;
  li.style.animation = 'none';
  li.innerHTML = `
    <span class="feedback-icon">${icon}</span>
    <span class="feedback-price">€${val.toFixed(2)}</span>
    <span class="feedback-hint">${hint}</span>
  `;
  document.getElementById('feedback-list').prepend(li);

  if (type === 'correct' || guesses.length >= MAX_GUESSES) {
    gameOver = true;
    const btn = document.getElementById('guess-btn');
    if (btn) btn.disabled = true;
  }
}

// ── Submit new guess ──────────────────────────────────────────────────────
function submitGuess() {
  if (gameOver) return;
  const input = document.getElementById('price-input');
  // Accept either "." or "," as decimal separator (iOS users often type commas).
  const val   = parseFloat((input.value || '').replace(',', '.'));

  if (isNaN(val) || val <= 0) { showError(t('voer-geldige-prijs')); shake(); return; }
  hideError();

  const margin = product.price * MARGIN;
  const low    = product.price - margin;
  const high   = product.price + margin;

  let type, icon, hint;
  if (val >= low && val <= high)    { type='correct';  icon='✓'; hint=t('raak'); }
  else if (val < low)               { type='too-low';  icon='↑'; hint=val<=product.price*.5?t('veel-te-laag'):t('te-laag'); }
  else                              { type='too-high'; icon='↓'; hint=val>=product.price*2?t('veel-te-hoog'):t('te-hoog'); }

  const idx = guesses.length;
  guesses.push(val);
  track('guess');

  const dot = document.getElementById(`dot-${idx}`);
  dot.classList.remove('current');
  dot.classList.add(`used-${type==='correct'?'correct':type==='too-high'?'high':'low'}`);
  dot.textContent = icon;
  if (idx+1 < MAX_GUESSES) document.getElementById(`dot-${idx+1}`)?.classList.add('current');

  document.getElementById('progress-bar').style.width = `${((idx+1)/MAX_GUESSES)*100}%`;

  const li = document.createElement('div');
  li.className = `feedback-item ${type==='correct'?'correct':type==='too-high'?'too-high':'too-low'}`;
  li.innerHTML = `
    <span class="feedback-icon">${icon}</span>
    <span class="feedback-price">€${val.toFixed(2)}</span>
    <span class="feedback-hint">${hint}</span>
  `;
  document.getElementById('feedback-list').prepend(li);

  input.value = '';
  input.focus();

  // Persist progress
  saveState({ product, guesses, done: false });

  if (type === 'correct') {
    gameOver = true;
    saveState({ product, guesses, done: true, won: true });
    track('finish', { attempts: guesses.length, won: true });
    setTimeout(() => showResult(true), 700);
  } else if (guesses.length >= MAX_GUESSES) {
    gameOver = true;
    document.getElementById('guess-btn').disabled = true;
    saveState({ product, guesses, done: true, won: false });
    track('finish', { attempts: guesses.length, won: false });
    setTimeout(() => showResult(false), 700);
  }
}

// ── Result + share ────────────────────────────────────────────────────────
// Every share links straight to the store you played.
function shareUrl() { return 'https://winkle.daiza.be/' + currentStore.slug; }

function buildShareText(won) {
  const icons = guesses.map(v => {
    const m = product.price * MARGIN;
    if (v >= product.price - m && v <= product.price + m) return '🟩';
    return v < product.price ? '🟦' : '🟥';
  });
  const remaining = MAX_GUESSES - guesses.length;
  const empties   = Array(remaining).fill('⬜');
  const shareName = MARKETS[currentMarket].shareName || 'Aldidle';
  return `${shareName} #${getDayNumber()} — ${formatDate(todayKey)}\n${[...icons,...empties].join('')}\n${won?`✅ ${t('geraden-in')} ${guesses.length}/${MAX_GUESSES}`:`❌ ${t('verloren-title')}`}\n${shareUrl()}`;
}

// ── Birthday easter egg ───────────────────────────────────────────────────
// A product carries special:'birthday' only on the day the server pins it,
// so these only ever fire on that single date.
function isBirthday(p) { return !!(p && p.special === 'birthday'); }

function birthdayBannerHTML() {
  return `<div class="birthday-banner">
      <div class="birthday-title">${t('verjaardag-titel')}</div>
      <div class="birthday-text">${t('verjaardag-tekst')}</div>
    </div>`;
}

function launchConfetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = (MARKETS[currentMarket].confetti) || ['#003087', '#E2001A', '#FFD400', '#ffffff'];
  const layer  = document.createElement('div');
  layer.className = 'confetti-layer';
  for (let i = 0; i < 90; i++) {
    const piece = document.createElement('span');
    piece.className = 'confetti-piece ' + (i % 2 ? 'spin-l' : 'spin-r');
    piece.style.left = (Math.random() * 100).toFixed(2) + 'vw';
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = (Math.random() * 0.7).toFixed(2) + 's';
    piece.style.animationDuration = (2.6 + Math.random() * 1.8).toFixed(2) + 's';
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 6000);
}

function showResult(won) {
  const sec = document.getElementById('input-section');
  if (sec) sec.style.display = 'none';

  const party = won && isBirthday(product);
  const div = document.createElement('div');
  div.id = 'result-screen';
  div.innerHTML = (party ? birthdayBannerHTML() : '') + (won
    ? `<div class="result-emoji">${t('gewonnen')}</div>
       <div class="result-title win">${t('gewonnen-title')}</div>
       <div class="result-price-reveal">${t('prijs-was')} <span class="real-price">€${product.price.toFixed(2)}</span></div>
       <p class="muted-note">${t('geraden-in')} ${guesses.length} ${guesses.length>1?t('pogingen'):t('pogingen').slice(0,-1)}</p>`
    : `<div class="result-emoji">${t('verloren')}</div>
       <div class="result-title lose">${t('verloren-title')}</div>
       <div class="result-price-reveal">${t('echte-prijs')} <span class="real-price">€${product.price.toFixed(2)}</span></div>
       <p class="muted-note">${t('morgen-kans')}</p>`);

  // Share button
  const shareText = buildShareText(won);
  const shareBtn  = document.createElement('button');
  shareBtn.className   = 'share-btn';
  shareBtn.textContent = t('deel-resultaat');
  shareBtn.onclick = async () => {
    try {
      if (navigator.share) {
        await navigator.share({ text: shareText });
      } else {
        await navigator.clipboard.writeText(shareText);
        copiedMsg.style.display = 'block';
        setTimeout(() => copiedMsg.style.display = 'none', 2500);
      }
    } catch {}
  };

  const copiedMsg = document.createElement('div');
  copiedMsg.className   = 'share-copied';
  copiedMsg.textContent = t('gekopieerd');

  // Countdown
  const countdownWrap = document.createElement('div');
  countdownWrap.className = 'countdown-wrap';
  countdownWrap.innerHTML = `
    <div class="countdown-label">${t('volgend-product')}</div>
    <div id="countdown">--:--:--</div>
  `;

  // Back to the landing page to pick another store to play.
  const againBtn = document.createElement('button');
  againBtn.className   = 'play-again-btn';
  againBtn.style.marginTop = '1rem';
  againBtn.textContent = t('ander-spel');
  againBtn.onclick     = () => { location.href = '/'; };

  div.appendChild(shareBtn);
  div.appendChild(copiedMsg);
  div.appendChild(countdownWrap);
  div.appendChild(againBtn);
  document.getElementById('product-card').appendChild(div);

  if (party) launchConfetti();
  startCountdown();
}

// ── Already-played screen ─────────────────────────────────────────────────
function showAlreadyPlayed(state) {
  const app = document.getElementById('app');
  const won = state.won;
  const shareText = (() => {
    const icons = state.guesses.map(v => {
      const m = state.product.price * MARGIN;
      if (v >= state.product.price - m && v <= state.product.price + m) return '🟩';
      return v < state.product.price ? '🟦' : '🟥';
    });
    const empties = Array(MAX_GUESSES - state.guesses.length).fill('⬜');
    const shareName = MARKETS[currentMarket].shareName || 'Aldidle';
    return `${shareName} #${getDayNumber()} — ${formatDate(todayKey)}\n${[...icons,...empties].join('')}\n${won?`✅ ${t('geraden-in')} ${state.guesses.length}/${MAX_GUESSES}`:`❌ ${t('verloren-title')}`}\n${shareUrl()}`;
  })();

  const party = won && isBirthday(state.product);

  app.innerHTML = `
    <div class="card">
      <div class="already-played">
        ${party ? birthdayBannerHTML() : ''}
        <div class="big-icon">${won ? '🏆' : '😔'}</div>
        <h2>${t('al-gespeeld')}</h2>
        <p>
          ${t('al-geraden')}${won ? t('al-gewonnen') : ''}.<br>
          De prijs van <strong>${state.product.name}</strong> was <strong>€${state.product.price.toFixed(2)}</strong>.<br>
          ${t('morgen-nieuw')}
        </p>
        <div class="countdown-wrap">
          <div class="countdown-label">${t('volgend-product')}</div>
          <div id="countdown">--:--:--</div>
        </div>
        <button class="share-btn" id="share-again-btn">${t('deel-resultaat')}</button>
        <div id="share-copied" class="share-copied">${t('gekopieerd')}</div>
        <button class="play-again-btn spaced" onclick="location.href='/'">${t('ander-spel')}</button>
      </div>
    </div>
  `;

  document.getElementById('share-again-btn').onclick = async () => {
    try {
      if (navigator.share) {
        await navigator.share({ text: shareText });
      } else {
        await navigator.clipboard.writeText(shareText);
        const el = document.getElementById('share-copied');
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2500);
      }
    } catch {}
  };

  if (party) launchConfetti();
  startCountdown();
}

function startCountdown() {
  function tick() {
    const now  = new Date();
    const next = new Date(now);
    next.setHours(24, 0, 0, 0);   // midnight
    const diff = next - now;
    const hh   = String(Math.floor(diff / 3600000)).padStart(2, '0');
    const mm   = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
    const ss   = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
    const el   = document.getElementById('countdown');
    if (el) el.textContent = `${hh}:${mm}:${ss}`;
  }
  tick();
  setInterval(tick, 1000);
}

function shake() {
  const w = document.getElementById('input-wrap');
  w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
}
function showError(m) { const e=document.getElementById('error-msg'); e.textContent=m; e.style.display='block'; }
function hideError()  { const e=document.getElementById('error-msg'); if(e) e.style.display='none'; }

// ── Start ─────────────────────────────────────────────────────────────────
async function startGame() {
  document.getElementById('lang-select').value = currentLang;
  document.getElementById('market-select').value = currentMarket;
  updateHeaderAndFooter();
  todayKey = getTodayKey();
  document.getElementById('header-date').textContent = `📅 ${formatDate(todayKey)}`;

  // Check if already completed today
  const state = loadState();
  if (state && state.done) {
    showAlreadyPlayed(state);
    return;
  }

  // If in-progress today, restore product but re-fetch if not cached
  if (state && state.product) {
    product = state.product;
    guesses = [];
    gameOver = false;
    buildGameUI(state.guesses || []);
    return;
  }

  // Fresh game
  product = null; guesses = []; gameOver = false;

  document.getElementById('app').innerHTML = `
    <div id="loading-screen" class="card card-center">
      <div class="spinner"></div>
      <div class="loading-label">${t('product-van-dag')}</div>
      <p id="loading-msg">${t('aldi-rekken')}</p>
    </div>`;

  const msgs = [t('aldi-rekken'), t('product-pagina'), t('server-opwarmt'), t('afbeelding-laden'), t('prijskaartje'), t('bijna-klaar')];
  let mi = 0;
  const ticker = setInterval(() => {
    mi = (mi+1) % msgs.length;
    const el = document.getElementById('loading-msg');
    if (el) el.textContent = msgs[mi];
  }, 1800);

  try {
    product = await fetchProduct(todayKey);
    clearInterval(ticker);
    saveState({ product, guesses: [], done: false });
    buildGameUI([]);
  } catch(err) {
    clearInterval(ticker);
    document.getElementById('app').innerHTML = `
      <div class="card card-center-lg">
        <div class="warn-icon">⚠️</div>
        <div class="warn-title">${t('kon-niet-laden')}</div>
        <div class="warn-detail">${err.message}</div>
        <button class="play-again-btn" onclick="startGame()">${t('probeer-opnieuw')}</button>
      </div>`;
  }
}

trackVisitOnce();
startGame();
</script>
