<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winkle – Raad de prijs!</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#1f2937">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --ink:#1a1a2e; --muted:#6b7280; }
  body {
    font-family:'DM Sans',sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#f6f8fb 0%,#eef2f7 100%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:2.5rem 1rem 3rem;
  }
  .hero { text-align:center; margin-bottom:2.5rem; }
  .wordmark {
    font-family:'Anton',sans-serif; font-size:clamp(2.8rem,11vw,4.5rem);
    letter-spacing:3px; line-height:1; color:var(--ink);
  }
  .wordmark span { color:#E2001A; }
  .tagline { margin-top:.6rem; font-size:1.05rem; font-weight:600; color:var(--ink); }
  .subtag  { margin-top:.2rem; font-size:.85rem; color:var(--muted); }

  .pick { font-size:.72rem; text-transform:uppercase; letter-spacing:.14em;
          color:var(--muted); font-weight:700; margin-bottom:1rem; text-align:center; }

  .stores {
    width:100%; max-width:640px;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:1rem;
  }
  .store-card {
    display:flex; flex-direction:column; align-items:center; text-decoration:none;
    background:#fff; border:1px solid #e5e7eb; border-radius:18px; overflow:hidden;
    box-shadow:0 2px 10px rgba(16,24,40,.05);
    transition:transform .16s ease, box-shadow .16s ease; color:inherit;
  }
  .store-card:hover { transform:translateY(-4px); box-shadow:0 12px 26px rgba(16,24,40,.14); }
  .store-logo {
    width:100%; height:120px; display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .store-logo .mark {
    font-family:'Anton',sans-serif; font-size:2.6rem; letter-spacing:3px; color:#fff;
  }
  .store-logo .bar { position:absolute; bottom:0; left:0; right:0; height:8px; }
  .store-name { padding:.9rem 1rem 1.05rem; font-weight:700; font-size:1.05rem; }
  .store-cta  { color:var(--muted); font-size:.78rem; font-weight:600; margin-top:.1rem; }

  footer { margin-top:auto; padding-top:2.5rem; color:var(--muted); font-size:.78rem; text-align:center; }
</style>
</head>
<body>
  <div class="hero">
    <div class="wordmark">WINK<span>LE</span></div>
    <div class="tagline">Raad de prijs van het dagelijkse product</div>
    <div class="subtag">Guess the price of today's product</div>
  </div>

  <div style="width:100%;max-width:640px">
    <div class="pick">Kies je winkel · Choose your store</div>
    <div class="stores" id="stores"></div>
  </div>

  <footer>Winkle is een fan-project &nbsp;·&nbsp; niet verbonden met de getoonde winkels</footer>

  <script src="/assets/stores.js"></script>
  <script>
    const grid = document.getElementById('stores');
    grid.innerHTML = Object.values(STORES).map(s => `
      <a class="store-card" href="/${s.slug}" aria-label="${s.name}">
        <div class="store-logo" style="background:${s.color}">
          <span class="mark">${s.logo}</span>
          <span class="bar" style="background:${s.accent}"></span>
        </div>
        <div class="store-name">${s.name}<div class="store-cta">Spelen →</div></div>
      </a>
    `).join('');
  </script>
</body>
</html>
